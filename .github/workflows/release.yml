name: Release
on:
  push:
    tags:
      - 'zisk-[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

jobs:
  build:
    uses: ./.github/workflows/build.yml
    secrets: inherit

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir tars
          mv ./artifacts/*/*.tar.gz tars/

          gh release create --repo "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME" --draft --latest=false ./tars/* || \
          gh release upload --repo "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME" ./tars/*

